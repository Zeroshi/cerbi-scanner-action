name: Cerbi Logging Governance Scanner
description: Find sensitive data, unsafe logging patterns, AI dependency signals, and logging policy violations before production.
author: Cerbi

branding:
  icon: shield
  color: purple

inputs:
  path:
    description: Repository path to scan.
    required: false
    default: .
  policy:
    description: Optional Cerbi policy file. When omitted, scanner discovery and safe defaults apply.
    required: false
    default: ''
  fail-on:
    description: Minimum severity that fails the action. Supports none, info, warning, low, medium, high, critical, error, and blocker.
    required: false
    default: none
  scanner-version:
    description: Cerbi.Scanner NuGet tool version. Use latest to follow the newest published scanner.
    required: false
    default: '1.2.2'
  output-directory:
    description: Directory for JSON, SARIF, and Markdown results. Defaults to a runner-temporary Cerbi directory.
    required: false
    default: ''
  no-snippets:
    description: Request privacy mode by omitting source snippets from scanner findings.
    required: false
    default: 'true'
  upload-sarif:
    description: Upload generated SARIF to GitHub code scanning. The workflow must grant security-events write permission.
    required: false
    default: 'false'
  upload-to-cerbishield:
    description: Explicitly upload scanner results to CerbiShield through the tenant-hosted scanner ingest endpoint. Requires cerbishield-url, cerbishield-token, and app.
    required: false
    default: 'false'
  cerbishield-url:
    description: Base URL of the customer-hosted CerbiShield Dashboard or Router.
    required: false
    default: ''
  cerbishield-token:
    description: Bearer token for CerbiShield upload. Pass from GitHub Secrets; it is masked and provided to the scanner through CERBI_TOKEN.
    required: false
    default: ''
  app:
    description: Cerbi app/service name used for X-Cerbi-App and scanner metadata when upload-to-cerbishield is true.
    required: false
    default: ''
  repo:
    description: Repository name or URL for scanner metadata. Defaults to github.repository when omitted.
    required: false
    default: ''
  branch:
    description: Branch name for scanner metadata. Defaults to github.ref_name when omitted.
    required: false
    default: ''
  commit:
    description: Commit SHA for scanner metadata. Defaults to github.sha when omitted.
    required: false
    default: ''
  build-id:
    description: Build or run identifier for scanner metadata. Defaults to github.run_id when omitted.
    required: false
    default: ''

outputs:
  json-file:
    description: Absolute path to the generated JSON report.
    value: ${{ steps.scan.outputs.json-file }}
  sarif-file:
    description: Absolute path to the generated SARIF report.
    value: ${{ steps.scan.outputs.sarif-file }}
  summary-file:
    description: Absolute path to the generated Markdown summary.
    value: ${{ steps.scan.outputs.summary-file }}
  ai-evidence-file:
    description: Absolute path to the generated AI Logging Evidence Markdown summary.
    value: ${{ steps.scan.outputs.ai-evidence-file }}
  ai-evidence-exists:
    description: Whether the generated AI Logging Evidence Markdown summary exists.
    value: ${{ steps.scan.outputs.ai-evidence-exists }}
  ai-signals:
    description: Number of metadata-only AI logging governance signals found in the scan report.
    value: ${{ steps.scan.outputs.ai-signals }}
  ai-raw-payload-findings:
    description: Number of raw AI-adjacent payload logging findings found in the scan report.
    value: ${{ steps.scan.outputs.ai-raw-payload-findings }}
  ai-runtime-governance-detected:
    description: Whether Cerbi AI runtime governance instrumentation was detected in the scan scope.
    value: ${{ steps.scan.outputs.ai-runtime-governance-detected }}
  scanner-exit-code:
    description: Cerbi Scanner exit code. 0 is clean, 1 means configured threshold breached, and 2 means scanner/configuration error.
    value: ${{ steps.scan.outputs.scanner-exit-code }}

runs:
  using: composite
  steps:
    - name: Setup .NET 10 LTS
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.0.x'

    - name: Run Cerbi Scanner
      id: scan
      shell: pwsh
      env:
        CERBI_SCAN_PATH: ${{ inputs.path }}
        CERBI_POLICY: ${{ inputs.policy }}
        CERBI_FAIL_ON: ${{ inputs.fail-on }}
        CERBI_SCANNER_VERSION: ${{ inputs.scanner-version }}
        CERBI_OUTPUT_DIRECTORY: ${{ inputs.output-directory }}
        CERBI_NO_SNIPPETS: ${{ inputs.no-snippets }}
        CERBI_UPLOAD_TO_CERBISHIELD: ${{ inputs.upload-to-cerbishield }}
        CERBI_ENDPOINT: ${{ inputs.cerbishield-url }}
        CERBI_TOKEN: ${{ inputs.cerbishield-token }}
        CERBI_APP: ${{ inputs.app }}
        CERBI_REPO: ${{ inputs.repo || github.repository }}
        CERBI_BRANCH: ${{ inputs.branch || github.ref_name }}
        CERBI_COMMIT: ${{ inputs.commit || github.sha }}
        CERBI_BUILD_ID: ${{ inputs.build-id || github.run_id }}
      run: '& "${{ github.action_path }}/scripts/run-cerbi-scanner.ps1"'

    - name: Upload Cerbi SARIF to code scanning
      if: ${{ inputs.upload-sarif == 'true' && steps.scan.outputs.sarif-exists == 'true' }}
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: ${{ steps.scan.outputs.sarif-file }}

    - name: Enforce Cerbi threshold
      shell: pwsh
      env:
        CERBI_SCANNER_EXIT_CODE: ${{ steps.scan.outputs.scanner-exit-code }}
      run: |
        $code = 0
        if (-not [int]::TryParse($env:CERBI_SCANNER_EXIT_CODE, [ref]$code)) {
          Write-Error "Cerbi Scanner did not return a valid exit code."
          exit 2
        }

        if ($code -eq 0) {
          exit 0
        }

        if ($code -eq 1) {
          Write-Error "Cerbi Scanner found one or more findings at or above the configured fail-on threshold."
          exit 1
        }

        Write-Error "Cerbi Scanner failed with exit code $code."
        exit $code
